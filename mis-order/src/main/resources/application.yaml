server:
  port: 8085

spring:
  main:
    web-application-type: servlet

  application:
    name: mis-order

  rabbitmq:
    host: ${MQ_HOST:127.0.0.1}
    port: 5672
    username: ${secrets.rabbitmq.username:guest}
    password: ${secrets.rabbitmq.password:guest}

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/isdp-db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: ${secrets.mysql.username:root}
    password: ${secrets.mysql.password:root}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      max-lifetime: 60000
      keepalive-time: 30000
      validation-timeout: 3000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: 6379
      password: ${secrets.redis.password:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          max-wait: -1ms
          min-idle: 1
          time-between-eviction-runs: 10s
