server:
  port: 8083 # 营销中心端口
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 1000
    max-connections: 10000
    connection-timeout: 5000

spring:
  application:
    name: mis-marketing

  rabbitmq:
    host: ${MQ_HOST:rabbitmq}
    port: 5672
    username: ${secrets.rabbitmq.username}
    password: ${secrets.rabbitmq.password}
    connection-timeout: 3000

    listener:
      simple:
        default-requeue-rejected: false
        # 消费端并发，先别调太高，避免 MySQL 被打爆
        concurrency: 4
        max-concurrency: 8
        prefetch: 20
        acknowledge-mode: auto

        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 5000ms


  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/isdp-db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${secrets.mysql.username}
    password: ${secrets.mysql.password}

    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 3000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000

      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${secrets.redis.password}
      timeout: 2000ms

      lettuce:
        pool:
          max-active: 200
          max-idle: 50
          min-idle: 20
          max-wait: 1000ms
          time-between-eviction-runs: 10s

logging:
  level:
    root: INFO
    edu.scau.mis.marketing: INFO
    org.springframework.security: WARN
    org.springframework.amqp: WARN
    org.springframework.data.redis: WARN
    com.zaxxer.hikari: WARN