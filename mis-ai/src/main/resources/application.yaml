server:
  port: 8087

spring:
  application:
    name: mis-ai

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${secrets.redis.password}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          max-wait: -1ms
          min-idle: 1

  ai:
    deepseek:
      api-key: ${secrets.ai.deepseek.api-key}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7