server:
  port: 8087

spring:
  application:
    name: mis-ai

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${secrets.redis.password}

  ai:
    openai:
      api-key: ${secrets.ai.openai.api-key}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7